name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Resolve deploy config
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f "public/CNAME" ]; then
            echo "检测到自定义域名 $(cat public/CNAME)，不设置 basePath"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "使用 GitHub Pages 默认域名，basePath=/$REPO_NAME"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi
          echo "NEXT_OUTPUT=export" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://coffee.mengyadiary.com" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Add .nojekyll and CNAME
        run: |
          touch out/.nojekyll
          if [ -f "public/CNAME" ]; then
            cp public/CNAME out/
            echo "已复制 CNAME 文件到 out 目录"
          fi
          ls -la out/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
